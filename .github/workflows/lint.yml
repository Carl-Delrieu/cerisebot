name: Lint

on:
    workflow_call:
    push:
        branches: [main]
    pull_request:

jobs:
    lint:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                node-version: 20
            - run: npm ci
            - run: npm run lint --if-present